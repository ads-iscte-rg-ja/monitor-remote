# Gerado a partir de monitor-platform/templates/sonar-project.properties.
# A chave do projeto e a organização vêm do SonarQube Cloud depois de importar o repo.
sonar.organization=rmgh97
sonar.projectKey=ads-iscte-rg-ja_monitor-remote

sonar.sources=.
# requeststest é o central gRPC falso usado pelos testes (como o net/http/httptest):
# é código de teste, partilhado por dois pacotes, e não entra no binário do agente.
sonar.exclusions=**/*_test.go,**/testdata/**,**/vendor/**,**/requeststest/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/requeststest/**

# Produzidos pelo workflow go-ci.yml do monitor-platform.
sonar.go.coverage.reportPaths=coverage.out,coverage-integration.out
sonar.go.golangci-lint.reportPaths=golangci-report.xml
